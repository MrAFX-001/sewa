# Backend replicas on the SEWA VM, load-balanced by the host's Nginx.
# Run from /home/sewa/sewa/deploy.
#
# network_mode: host is deliberate:
#  - DATABASE_URL=localhost:5432 keeps working, no pg_hba / listen_addresses changes
#  - Docker's published ports bypass UFW; host networking + HOST=127.0.0.1 avoids that
x-api: &api
  build:
    context: ../backend
    target: runtime
  image: sewa-api:latest
  network_mode: host
  restart: unless-stopped
  user: "${SEWA_UID:-1000}:${SEWA_GID:-1000}"
  env_file: ../backend/.env
  volumes:
    - ../backend/uploads:/app/uploads
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  depends_on:
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379",
              "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ../backend, target: migrate }
    image: sewa-api-migrate:latest
    network_mode: host
    env_file: ../backend/.env
    profiles: ["tools"]      # only runs when called explicitly

  # One service per replica (fixed ports so Nginx can list them).
  # 4 replicas for the 6-core VM (leaves ~2 cores for Postgres + frontend).
  api-1:
    <<: *api
    environment: &apienv
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "4001"
      REDIS_URL: redis://127.0.0.1:6379
      UPLOAD_DIR: uploads/id-cards
      ENABLE_IN_PROCESS_CRON: "true"   # only this replica runs OTP cleanup
  api-2:
    <<: *api
    environment:
      <<: *apienv
      PORT: "4002"
      ENABLE_IN_PROCESS_CRON: "false"
  api-3:
    <<: *api
    environment:
      <<: *apienv
      PORT: "4003"
      ENABLE_IN_PROCESS_CRON: "false"
  api-4:
    <<: *api
    environment:
      <<: *apienv
      PORT: "4004"
      ENABLE_IN_PROCESS_CRON: "false"
