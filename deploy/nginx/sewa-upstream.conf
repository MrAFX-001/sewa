# /etc/nginx/conf.d/sewa-upstream.conf   (http context)
upstream sewa_backend {
    least_conn;
    # A replica that refuses connections is skipped for 10s
    server 127.0.0.1:4001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=1 fail_timeout=10s;

    # Rollback: comment the four lines above, uncomment this, reload nginx,
    # and `sudo systemctl start sewa-backend`.
    # server 127.0.0.1:4000;

    keepalive 32;
}

# Used by the frontend location for websocket/HMR-style upgrades if any;
# otherwise lets keep-alive work normally.
map $http_upgrade $connection_upgrade_or_close {
    default upgrade;
    ''      close;
}
