# /etc/nginx/snippets/sewa-proxy.conf — shared proxy settings for the API
proxy_pass http://sewa_backend;           # no trailing slash: keeps /api/ prefix
proxy_http_version 1.1;
proxy_set_header Connection "";           # upstream keepalive
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
# $remote_addr is the real visitor after cloudflare-realip.conf.
# Overwrite (not append) so clients can't spoof X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Rolling restarts: a refused connection moves to the next replica.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_connect_timeout 3s;
proxy_read_timeout 60s;



