# /etc/nginx/conf.d/sewa-limits.conf   (http context)
#
# Per-IP request limits, applied BEFORE anything reaches Node/Postgres.
# $binary_remote_addr is the real visitor IP because cloudflare-realip.conf
# (realip module) runs before limit_req.
#
# Rates are per single IP and sized for shared campus / carrier-NAT IPs:
# a lab of students behind one IP stays well under them; one script
# hammering an endpoint does not.

limit_req_zone  $sewa_limit_key zone=sewa_api:20m    rate=20r/s;
limit_req_zone  $sewa_limit_key zone=sewa_pages:20m  rate=30r/s;
limit_req_zone  $sewa_limit_key zone=sewa_health:5m  rate=1r/s;
limit_conn_zone $sewa_limit_key zone=sewa_conn:20m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# Micro-cache for public, identical-for-everyone GET responses.
proxy_cache_path /var/cache/nginx/sewa_api levels=1:2 keys_zone=sewa_api_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;
