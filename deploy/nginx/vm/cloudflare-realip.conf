# DTU edge device that forwards all public traffic (Cloudflare -> DTU -> VM).
# Only requests FROM this address may set the client IP via CF-Connecting-IP.
# Campus machines hitting the VM directly (10.12.x etc.) are not trusted and
# keep their own address.
set_real_ip_from 10.50.0.100;
real_ip_header   CF-Connecting-IP;



